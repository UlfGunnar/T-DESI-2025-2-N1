<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de livros</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>titulo</th>
                <th>autor</th>
                <th>n° páginas</th>
            </tr>
        </thead>
        <tbody>
            {% for i in range(livros|length) %}
                <tr>
                    <td>{{% livros[i]["titulo"] %}}</td>
                    <td>{{% livros[i]["autor"] %}}</td>
                    <td>{{% livros[i]["paginas"] %}}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
