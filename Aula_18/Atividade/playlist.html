<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist de músicas</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            background-color: rgba(127, 255, 212, 0.466);
        }
        main {
            border: 1px black solid;
            background-color: whitesmoke;
            padding: 50px;
            box-shadow: 2px 5px 5px rgba(0, 0, 0, 0.479);
            border-radius: 10px;
        }
        h1 {
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
        }
        th {
            background-color: rgb(179, 177, 177);
        }
        td, th {
            border: 1px black solid;
            padding: 5px;
        }
        tr:hover > td{
            background-color: rgba(0, 255, 255, 0.178);
        }
    </style>
</head>
<body>
    <main>
        <h1>Playlist de Músicas</h1>
        {% if musicJ|length == 0 %}
            <p>Nenhuma música cadastrada no momento.</p>
    
        {% else %}
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Estilo</th>
                        <th>Duração</th>
                    </tr>
                </thead>
                <tbody>
                    {% for i in range(musicJ|length) %}
                    <tr>
                        <td>{{ musicJ[i]['titulo'] }}</td>
                        <td>{{ musicJ[i]['artista'] }}</td>
                        <td>{{ musicJ[i]['estilo'] }}</td>
                        <td>{{ musicJ[i]['duracao'] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        {% endif %}
    </main>
</body>
</html>
